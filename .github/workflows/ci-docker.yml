name: CI Docker

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/auy1102-pipeline

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t $IMAGE_NAME:test .

      - name: Run unit tests inside container
        run: docker run --rm $IMAGE_NAME:test

      - name: Login to Docker Hub (only on push to develop)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push runtime image (only on push to develop)
        if: github.event_name == 'push'
        run: |
          docker build --target runtime -t $IMAGE_NAME:develop -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:develop
          docker push $IMAGE_NAME:${{ github.sha }}
