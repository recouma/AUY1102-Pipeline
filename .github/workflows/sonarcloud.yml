name: SonarCloud

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
